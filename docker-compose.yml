services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: studypilot
      POSTGRES_USER: studypilot
      POSTGRES_PASSWORD: studypilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - .env
    environment:
      STUDYPILOT_DATABASE_URL: postgresql+psycopg://studypilot:studypilot@postgres:5432/studypilot
      STUDYPILOT_STORAGE_ROOT: /app/storage
      STUDYPILOT_STORAGE_RAW_DIR: /app/storage/raw
      STUDYPILOT_STORAGE_PARSED_DIR: /app/storage/parsed
      STUDYPILOT_STORAGE_TEMP_DIR: /app/storage/temp
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
