[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studypilot-api"
version = "0.1.0"
description = "StudyPilot phase 0 API scaffold"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13.2",
  "fastapi>=0.115.0",
  "langgraph>=0.2.34",
  "openai>=1.52.0",
  "pypdf>=5.0.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.32",
  "psycopg[binary]>=3.2.1",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.2"
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests/api"]
